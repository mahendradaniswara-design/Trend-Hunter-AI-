<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial; }
    .tab { display:none; }
    canvas { max-width:500px; }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <h2>YHWH Login</h2>
  <input id="user" placeholder="Username">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="doLogin()">Login</button>
</div>

<!-- APP -->
<div id="app" style="display:none;">

<h2>YHWH System</h2>

<button onclick="showTab('dashboard')">Dashboard</button>
<button onclick="showTab('archive')">Archive</button>
<button onclick="showTab('upload')">Upload</button>
<button onclick="exportPDF()">Export PDF</button>

<!-- DASHBOARD -->
<div id="dashboard" class="tab">
  <h3>Dashboard</h3>
  <canvas id="chart"></canvas>
</div>

<!-- ARCHIVE -->
<div id="archive" class="tab">
  <h3>Archive</h3>

  <input id="number" placeholder="Letter Number">
  <input id="subject" placeholder="Subject">
  
  <input type="file" id="file">

  <button onclick="submitArchive()">Submit</button>
</div>

<!-- UPLOAD -->
<div id="upload" class="tab">
  <h3>Upload File</h3>
  <input type="file" id="fileUpload">
  <button onclick="upload()">Upload</button>
</div>

</div>

<script>

let role = "";

// LOGIN
function doLogin(){
  google.script.run.withSuccessHandler(res=>{
    if(res.status){
      role = res.role;
      login.style.display="none";
      app.style.display="block";
      loadDashboard();
    } else {
      alert("Login failed");
    }
  }).login(user.value, pass.value);
}

// TAB
function showTab(tab){
  document.querySelectorAll('.tab').forEach(t=>t.style.display='none');
  document.getElementById(tab).style.display='block';
}

// DASHBOARD
function loadDashboard(){
  google.script.run.withSuccessHandler(data=>{
    const ctx = document.getElementById('chart');

    new Chart(ctx, {
      type: 'pie',
      data: {
        labels: Object.keys(data.categories),
        datasets: [{
          data: Object.values(data.categories)
        }]
      }
    });

  }).getDashboardData();
}

// UPLOAD FILE
function upload(){
  const file = fileUpload.files[0];
  const reader = new FileReader();

  reader.onload = function(e){
    const base64 = e.target.result.split(",")[1];

    google.script.run.withSuccessHandler(url=>{
      alert("Uploaded: " + url);
    }).uploadFile(base64, file.name);
  };

  reader.readAsDataURL(file);
}

// ARCHIVE + FILE
function submitArchive(){
  const file = document.getElementById("file").files[0];

  if(file){
    const reader = new FileReader();

    reader.onload = function(e){
      const base64 = e.target.result.split(",")[1];

      google.script.run.withSuccessHandler(url=>{
        saveData(url);
      }).uploadFile(base64, file.name);
    };

    reader.readAsDataURL(file);
  } else {
    saveData("");
  }
}

function saveData(fileUrl){
  google.script.run.saveArchive({
    number: number.value,
    subject: subject.value,
    fileUrl: fileUrl
  });

  alert("Saved!");
}

// EXPORT PDF
function exportPDF(){
  google.script.run.withSuccessHandler(url=>{
    window.open(url);
  }).exportPDF();
}

</script>

</body>
</html>
